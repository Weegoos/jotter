version: '3.8'

services:
  frontend:
    build:
      context: ./jotter                # путь к Quasar frontend
      dockerfile: Dockerfile.dev      # используем dev-версию Dockerfile
    ports:
      - "9000:9000"                    # проброс порта для Quasar Dev
    volumes:
      - ./jotter:/app                 # код фронта
      - frontend_node_modules:/app/node_modules  # node_modules внутри контейнера
    stdin_open: true
    tty: true
    depends_on:
      - backend                       # запустится после backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev      # Dockerfile для Node.js + Express
    ports:
      - "3000:3000"                   # порт backend API
    volumes:
      - ./server:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - PENDIND_STATUS=${PENDIND_STATUS}
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

volumes:
  pgdata:                  # база данных
  frontend_node_modules:   # node_modules для фронта
  backend_node_modules:    # node_modules для бэка
